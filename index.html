<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic_Tac_Toe Game</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="msg-container hide">
        <p id ="msg">WINNER</p>
    </div>
    <main>
        <div class="gm">
        <h1>Tic Tac Toe</h1>
        <div class="player-inputs">
            <input type="text" id="player1" placeholder="Player 1 (O)" value="Player 1">
            <input type="text" id="player2" placeholder="Player 2 (X)" value="Player 2">
        </div>
        <div id="turn-display">Player 1's turn (O)</div>
            <div class="container">
                <div class="game">
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                </div>
            </div>
        </div>
            <button id="reset-btn">Reset Game</button>
    </main>
    <script src="app.js"></script>
</body>
</html>
